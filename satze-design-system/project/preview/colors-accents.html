<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);}
.wrap{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.sw{display:flex;align-items:center;gap:14px;}
.chip{width:72px;height:72px;flex-shrink:0;}
.meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
.meta b{display:block;font-weight:700;font-size:14px;letter-spacing:.15em;}
.meta span{color:var(--fg2);display:block;}
.g-cyan{background:#38bdf8;box-shadow:0 0 18px #38bdf888;}
.g-gold{background:#d4af37;box-shadow:0 0 18px #d4af3788;}
.g-fire{background:#f97316;box-shadow:0 0 18px #f9731688;}
.g-mag{background:#d946ef;box-shadow:0 0 18px #d946ef88;}
.g-blood{background:#dc2626;box-shadow:0 0 18px #dc262688;}
.g-ice{background:#60a5fa;box-shadow:0 0 18px #60a5fa88;}
</style></head><body><div class="wrap">
<div class="sw"><div class="chip g-cyan"></div><div class="meta"><b style="color:#38bdf8">Cyan</b><span>#38bdf8</span><span>Primary accent</span></div></div>
<div class="sw"><div class="chip g-gold"></div><div class="meta"><b style="color:#d4af37">Gold</b><span>#d4af37</span><span>Elite / legendary</span></div></div>
<div class="sw"><div class="chip g-fire"></div><div class="meta"><b style="color:#f97316">Fire</b><span>#f97316</span><span>Assault / warmth</span></div></div>
<div class="sw"><div class="chip g-mag"></div><div class="meta"><b style="color:#d946ef">Magenta</b><span>#d946ef</span><span>Rare / arcane</span></div></div>
<div class="sw"><div class="chip g-blood"></div><div class="meta"><b style="color:#dc2626">Blood</b><span>#dc2626</span><span>Danger / HP loss</span></div></div>
<div class="sw"><div class="chip g-ice"></div><div class="meta"><b style="color:#60a5fa">Ice</b><span>#60a5fa</span><span>Info / calm</span></div></div>
</div></body></html>
