<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:radial-gradient(ellipse at center,#0a1628,#000 70%);color:var(--fg1);font-family:var(--font-ui);padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.wordmark{font-family:'Cinzel',serif;font-weight:900;font-size:80px;letter-spacing:.35em;text-transform:uppercase;color:#e8eaed;text-shadow:0 0 30px rgba(56,189,248,.3), 0 4px 12px rgba(0,0,0,.9);line-height:1;margin-left:.35em;}
.sub{font-family:'Cinzel',serif;font-style:italic;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#94a3b8;}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,#38bdf8,transparent);margin:4px 0;}
</style></head><body>
<div class="wordmark">Satze</div>
<div class="rule"></div>
<div class="sub">La Grande Guerra</div>
</body></html>
