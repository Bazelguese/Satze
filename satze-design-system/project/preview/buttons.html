<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:22px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.btn{font-family:var(--font-ui);font-weight:600;font-size:13px;letter-spacing:.15em;text-transform:uppercase;padding:10px 20px;border:1.5px solid var(--accent-slate);background:rgba(56,189,248,.06);color:var(--fg1);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);}
.btn.hover{border-color:#38bdf8;background:rgba(56,189,248,.18);box-shadow:0 0 12px #38bdf888, 0 0 24px #38bdf844;}
.btn.gold{border-color:#d4af37;background:rgba(212,175,55,.15);box-shadow:0 0 12px #d4af3788, 0 0 24px #d4af3744;}
.btn.fire{border-color:#f97316;background:rgba(249,115,22,.15);box-shadow:0 0 12px #f9731688, 0 0 24px #f9731644;}
.btn.danger{border-color:#dc2626;background:rgba(220,38,38,.15);box-shadow:0 0 12px #dc262688, 0 0 24px #dc262644;}
.btn:disabled,.btn.dis{opacity:.5;cursor:not-allowed;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg2);width:110px;letter-spacing:.1em;}
</style></head><body>
<div class="row"><div class="lbl">DEFAULT</div><button class="btn">Nuova Partita</button><button class="btn">Continua</button><button class="btn">Impostazioni</button></div>
<div class="row"><div class="lbl">HOVER</div><button class="btn hover">Nuova Partita</button><button class="btn gold">Campagna</button><button class="btn fire">Assalto</button><button class="btn danger">Abbandona</button></div>
<div class="row"><div class="lbl">DISABLED</div><button class="btn dis">Multigiocatore</button></div>
</body></html>
