<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:22px;}
.panel{position:relative;background:linear-gradient(135deg,rgba(10,22,40,.9),rgba(5,6,8,.95));border:1.5px solid #38bdf8;box-shadow:0 0 24px #38bdf833, inset 0 0 40px rgba(0,0,0,.6);padding:18px 22px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
.corner{position:absolute;width:14px;height:14px;border:1.5px solid #38bdf8;}
.c1{top:4px;left:4px;border-right:none;border-bottom:none;}
.c2{top:4px;right:4px;border-left:none;border-bottom:none;}
.c3{bottom:4px;left:4px;border-right:none;border-top:none;}
.c4{bottom:4px;right:4px;border-left:none;border-top:none;}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.title{font-family:'Chakra Petch';font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#38bdf8;}
.tag{font-family:'Share Tech Mono';font-size:10px;color:#94a3b8;letter-spacing:.1em;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{border:1px solid rgba(56,189,248,.25);padding:8px 10px;background:rgba(56,189,248,.04);}
.stat .k{font-family:'Chakra Petch';font-size:9px;color:#94a3b8;letter-spacing:.15em;text-transform:uppercase;}
.stat .v{font-family:'Share Tech Mono';font-size:22px;color:#fbbf24;letter-spacing:.05em;}
</style></head><body>
<div class="panel">
 <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
 <div class="head"><div class="title">Tabellone Tattico</div><div class="tag">[TRN 04 / 12]</div></div>
 <div class="stats">
  <div class="stat"><div class="k">Focus Coin</div><div class="v">12</div></div>
  <div class="stat"><div class="k">Potere Carte</div><div class="v">38</div></div>
  <div class="stat"><div class="k">Vita</div><div class="v">22</div></div>
 </div>
</div>
</body></html>
