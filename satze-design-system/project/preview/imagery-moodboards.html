<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tile{position:relative;height:112px;background-size:cover;background-position:center;border:1.5px solid var(--accent-slate);overflow:hidden;}
.tile .lbl{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fff;}
</style></head><body>
<div class="tile" style="background-image:url('../assets/army-bg/orizzonte.png')"><div class="lbl">Orizzonte</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/kethran.png')"><div class="lbl">Kethran</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/corte-rossa.png')"><div class="lbl">Corte Rossa</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/calibri-pesanti.png')"><div class="lbl">Calibri</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/orathai.png')"><div class="lbl">Orathai</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/mounthborn.png')"><div class="lbl">Mounthborn</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/enclave.png')"><div class="lbl">Enclave</div></div>
<div class="tile" style="background-image:url('../assets/army-bg/ratti.png')"><div class="lbl">Ratti</div></div>
</body></html>
