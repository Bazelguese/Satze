<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:20px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:8px;align-items:center;}
.lbl{font-family:'Share Tech Mono';font-size:10px;color:var(--fg2);letter-spacing:.1em;width:110px;}
.pill{padding:4px 14px;border:1px solid;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;}
.input{background:rgba(56,189,248,.06);border:1.5px solid #334155;color:#e8eaed;font-family:'Chakra Petch';font-size:13px;letter-spacing:.1em;padding:8px 12px;width:200px;outline:none;}
.input:focus{border-color:#38bdf8;box-shadow:0 0 12px #38bdf855;}
</style></head><body>
<div class="row"><div class="lbl">MISSION TAGS</div>
 <span class="pill" style="color:#f97316;border-color:#f97316;background:#f9731622">ASS</span>
 <span class="pill" style="color:#38bdf8;border-color:#38bdf8;background:#38bdf822">DIF</span>
 <span class="pill" style="color:#d4af37;border-color:#d4af37;background:#d4af3722">DOM</span>
 <span class="pill" style="color:#dc2626;border-color:#dc2626;background:#dc262622">ANN</span>
 <span class="pill" style="color:#a78bfa;border-color:#a78bfa;background:#a78bfa22">SPC</span>
</div>
<div class="row"><div class="lbl">INPUT</div><input class="input" placeholder="Nome giocatore…" value="Sorethal"></div>
<div class="row"><div class="lbl">STATUS</div>
 <span class="pill" style="color:#10b981;border-color:#10b981;background:#10b98122">Attivo</span>
 <span class="pill" style="color:#94a3b8;border-color:#94a3b8;background:#94a3b822">In attesa</span>
 <span class="pill" style="color:#dc2626;border-color:#dc2626;background:#dc262622">Sconfitto</span>
</div>
</body></html>
