<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);}
.wrap{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.army{border:1.5px solid var(--accent-slate);padding:10px;display:flex;align-items:center;gap:10px;background:rgba(10,22,40,0.5);}
.army img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 8px currentColor);}
.army .bar{width:4px;height:40px;}
.meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
.meta b{display:block;font-size:12px;letter-spacing:.15em;color:var(--fg1);}
.meta span{color:var(--fg3);font-family:var(--font-mono);}
</style></head><body><div class="wrap">
<div class="army" style="color:#a78bfa"><div class="bar" style="background:#a78bfa"></div><img src="../assets/armies/orizzonte.png"><div class="meta"><b>Orizzonte</b><span>#a78bfa</span></div></div>
<div class="army" style="color:#fbbf24"><div class="bar" style="background:#fbbf24"></div><img src="../assets/armies/kethran.png"><div class="meta"><b>Kethran</b><span>#fbbf24</span></div></div>
<div class="army" style="color:#dc2626"><div class="bar" style="background:#dc2626"></div><img src="../assets/armies/corte-rossa.png"><div class="meta"><b>Corte Rossa</b><span>#dc2626</span></div></div>
<div class="army" style="color:#64748b"><div class="bar" style="background:#64748b"></div><img src="../assets/armies/calibri-pesanti.png"><div class="meta"><b>Calibri Pesanti</b><span>#64748b</span></div></div>
<div class="army" style="color:#14b8a6"><div class="bar" style="background:#14b8a6"></div><img src="../assets/armies/orathai.png"><div class="meta"><b>Orathai</b><span>#14b8a6</span></div></div>
<div class="army" style="color:#84cc16"><div class="bar" style="background:#84cc16"></div><img src="../assets/armies/mounthborn.png"><div class="meta"><b>Mounthborn</b><span>#84cc16</span></div></div>
<div class="army" style="color:#ea580c"><div class="bar" style="background:#ea580c"></div><img src="../assets/armies/enclave.png"><div class="meta"><b>Enclave</b><span>#ea580c</span></div></div>
<div class="army" style="color:#10b981"><div class="bar" style="background:#10b981"></div><img src="../assets/armies/ratti.png"><div class="meta"><b>Ratti</b><span>#10b981</span></div></div>
</div></body></html>
