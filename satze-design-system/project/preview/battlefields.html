<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.tile{height:140px;background-size:cover;background-position:center;border:1.5px solid var(--accent-slate);position:relative;}
.tile::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5));}
.cap{position:absolute;bottom:8px;left:10px;font-family:'Share Tech Mono';font-size:10px;letter-spacing:.12em;color:#fff;text-shadow:0 1px 4px #000;z-index:1;}
</style></head><body>
<div class="tile" style="background-image:url('../assets/battlefields/campo-1.png')"><div class="cap">CAMPO · 01</div></div>
<div class="tile" style="background-image:url('../assets/battlefields/campo-5.png')"><div class="cap">CAMPO · 05</div></div>
<div class="tile" style="background-image:url('../assets/battlefields/campo-12.png')"><div class="cap">CAMPO · 12</div></div>
<div class="tile" style="background-image:url('../assets/battlefields/campo-20.png')"><div class="cap">CAMPO · 20</div></div>
</body></html>
