<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.card{background:var(--bg-panel);border:1.5px solid var(--accent-slate);padding:18px 12px;text-align:center;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--accent-cyan);letter-spacing:.1em;margin-top:10px;}
.pill{display:inline-block;padding:6px 18px;background:rgba(56,189,248,.15);color:#38bdf8;font-size:11px;letter-spacing:.15em;text-transform:uppercase;border:1px solid #38bdf8;}
</style></head><body>
<div class="card" style="border-radius:0"><div style="width:72px;height:36px;background:#38bdf8;margin:0 auto;"></div><div class="lbl">R-0 · 0PX</div></div>
<div class="card" style="border-radius:0"><div style="width:72px;height:36px;background:#38bdf8;border-radius:2px;margin:0 auto;"></div><div class="lbl">R-1 · 2PX</div></div>
<div class="card" style="border-radius:0"><div style="width:72px;height:36px;background:#38bdf8;border-radius:4px;margin:0 auto;"></div><div class="lbl">R-2 · 4PX</div></div>
<div class="card" style="border-radius:0"><div style="width:72px;height:36px;background:#38bdf8;border-radius:8px;margin:0 auto;"></div><div class="lbl">R-3 · 8PX</div></div>
<div class="card" style="border-radius:0"><div style="width:72px;height:36px;background:#38bdf8;border-radius:12px;margin:0 auto;"></div><div class="lbl">R-CARD · 12PX</div></div>
</body></html>
