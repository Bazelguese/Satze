<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;background:var(--bg-night);color:var(--fg1);font-family:var(--font-ui);padding:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:center;justify-items:center;}
.box{width:96px;height:64px;background:var(--bg-panel);border:1.5px solid var(--accent-slate);}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg2);margin-top:12px;letter-spacing:.1em;text-align:center;}
.cell{display:flex;flex-direction:column;align-items:center;}
</style></head><body>
<div class="cell"><div class="box" style="box-shadow:0 2px 8px rgba(0,0,0,.8);"></div><div class="lbl">SH-FLAT</div></div>
<div class="cell"><div class="box" style="box-shadow:0 4px 16px rgba(0,0,0,.9);"></div><div class="lbl">SH-DROP</div></div>
<div class="cell"><div class="box" style="box-shadow:inset 0 0 40px rgba(0,0,0,.45);"></div><div class="lbl">SH-INSET</div></div>
<div class="cell"><div class="box" style="box-shadow:0 0 12px #38bdf888, 0 0 24px #38bdf844;border-color:#38bdf8;"></div><div class="lbl">GLOW-CYAN</div></div>
<div class="cell"><div class="box" style="box-shadow:0 0 12px #d4af3788, 0 0 24px #d4af3744;border-color:#d4af37;"></div><div class="lbl">GLOW-GOLD</div></div>
<div class="cell"><div class="box" style="box-shadow:0 0 12px #f9731688, 0 0 24px #f9731644;border-color:#f97316;"></div><div class="lbl">GLOW-FIRE</div></div>
<div class="cell"><div class="box" style="box-shadow:0 0 12px #dc262688, 0 0 24px #dc262644;border-color:#dc2626;"></div><div class="lbl">GLOW-BLOOD</div></div>
<div class="cell"><div class="box" style="box-shadow:0 0 12px #d946ef88, 0 0 24px #d946ef44;border-color:#d946ef;"></div><div class="lbl">GLOW-MAG</div></div>
</body></html>
