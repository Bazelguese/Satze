# fly.toml app configuration file generated for satze-ws on 2026-07-10T01:42:02+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'satze-ws'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

# Bot del ruolo Playtester (server/discordRuoli.mjs). Il token NON va qui:
#   fly secrets set DISCORD_BOT_TOKEN=...
# Gli id non sono segreti: server Discord, canale #inizia-qui, ruolo Playtester.
[env]
  SATZE_RUOLI_SERVER = '1565311514313756712'
  SATZE_RUOLI_CANALE = '1570379394185437304'
  SATZE_RUOLI_RUOLO = '1568987790484709426'
  SATZE_RUOLI_EMOJI = '🎮'

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = 'satze_rooms_data'
  destination = '/app/data'
