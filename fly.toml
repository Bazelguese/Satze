# Fly.io — dopo: fly launch --no-deploy && fly deploy
# Imposta la variabile PORT automaticamente; il server usa process.env.PORT

app = "satze-ws"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
