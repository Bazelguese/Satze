<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Satze · Demo dialoghi — Corte Rossa</title>
<link rel="stylesheet" href="satze-dialogue.css">
<style>
  body{margin:0;background:#0b0b0f;color:#e5e5e5;font-family:'Chakra Petch',system-ui,sans-serif;}
  header{padding:16px 22px;border-bottom:1px solid #222;}
  h1{margin:0;font-size:18px;letter-spacing:.04em;}
  h1 small{color:#888;font-weight:400;}
  .wrap{display:flex;gap:24px;padding:22px;flex-wrap:wrap;}
  .scene{position:relative;flex:1;min-width:360px;min-height:460px;background:
    radial-gradient(120% 90% at 50% 12%, #241016 0%, #0b0b0f 60%);
    border:1px solid #2a1a20;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;}
  .card{width:150px;height:210px;border-radius:10px;border:3px solid #f43f5e;
    background:linear-gradient(160deg,#1a0e12,#2a121a);box-shadow:0 0 22px #f43f5e33,0 12px 30px #000a;
    display:flex;flex-direction:column;justify-content:space-between;padding:10px;position:relative;}
  .card .nm{font-size:12px;font-weight:700;letter-spacing:.03em;color:#fecdd3;line-height:1.15;}
  .card .stat{display:flex;gap:8px;font-size:11px;color:#f9a8b4;}
  .card .lg{position:absolute;top:8px;right:8px;font-size:11px;color:#f43f5e;font-weight:700;}
  .panel{width:300px;background:#111116;border:1px solid #222;border-radius:12px;padding:16px;}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#888;margin:0 0 10px;}
  select,button{font-family:inherit;font-size:13px;}
  select{width:100%;padding:8px;background:#0b0b0f;color:#eee;border:1px solid #333;border-radius:7px;margin-bottom:12px;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  button{padding:9px 8px;background:#1c1c24;color:#eee;border:1px solid #3a3a46;border-radius:7px;cursor:pointer;}
  button:hover{background:#26262f;border-color:#f43f5e;}
  button.wide{grid-column:1/3;background:#f43f5e;color:#180508;border-color:#f43f5e;font-weight:700;}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:#bbb;}
  .hint{font-size:11px;color:#666;margin-top:14px;line-height:1.5;}
  code{color:#f9a8b4;}
</style>
</head>
<body>
<header><h1>Satze · Dialoghi Corte Rossa <small>— demo enfasi selettiva (v0.2)</small></h1></header>
<div class="wrap">
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="lg" id="c-lg">L5</div>
      <div class="nm" id="c-nm">Generale Karthessi</div>
      <div class="stat" id="c-st">POT 5 · DAN 4</div>
    </div>
  </div>
  <div class="panel">
    <h2>Carta</h2>
    <select id="pick"></select>
    <h2>Evento</h2>
    <div class="btns">
      <button data-ev="entrata">Entrata</button>
      <button data-ev="triggerAttivato">Trigger</button>
      <button data-ev="vince">Vince</button>
      <button data-ev="perde">Perde</button>
      <button data-ev="stat">vs Colosso</button>
      <button data-ev="morte">Morte</button>
      <button class="wide" id="seq">▶ Sequenza di scontro</button>
    </div>
    <div class="row"><input type="checkbox" id="emph" checked><label for="emph">enfasi selettiva (off = tutto animato)</label></div>
    <div class="hint">Testo fermo di default; si animano solo le parti marcate.<br>
      <code>*parola*</code> = effetto firma (shake) · <code>{glitch:parola}</code> = override.<br>
      Clicca sul box per completare la riga.</div>
  </div>
</div>

<script src="satze-dialogue.js"></script>
<script>
// sottoinsieme dei dialoghi Corte per la demo (schema identico a dialoghi-corte.js)
var D = {
  311: { nm:"Generale Karthessi", lg:"L5", st:"POT 5 · DAN 4",
    entrata:["Non ricordo il mio nome. Ricordo la *firma*.","Combatto per la Corte. Come tu farai."],
    triggerAttivato:["Dal terzo conto in poi, ciò che sai fare lo faccio io."],
    vince:["Il tuo potere ti stava stretto. *Lo indosso io*."],
    perde:["Ho perso. Di nuovo. Come col mio popolo."],
    stat:["*Finalmente.* Qualcosa che valga la pena rubare."],
    morte:["Torno a... a dove? ...non ricordo."] },
  305: { nm:"Avvocato del Diavolo", lg:"L3", st:"POT 2 · DAN 5",
    entrata:["Legalmente, la tua anima non ti è mai appartenuta.","Vedi, c'è questa {flicker:clausola}..."],
    triggerAttivato:["Anticipo. E anticipando, la tua POT diventa {flicker:mia}."],
    vince:["Comma 7, sottosezione C. Avevo *ragione io*."],
    perde:["Faccio... appello."],
    stat:["Bella POT. C'è una clausola che la rende mia."],
    morte:["Obiezione... respinta..."] },
  315: { nm:"Larva della Corte", lg:"L2", st:"POT 1 · DAN 3",
    entrata:["Ho firmato ieri. O oggi? *Ho fame*, comunque.","Un contratto tira l'altro."],
    triggerAttivato:["Arrivo seconda. Ma mangio *prima*."],
    vince:["*Cresco!*"],
    perde:["Non... non era abbastanza. Fame, ancora."],
    stat:["Così *grosso*... così tanto da mangiare."],
    morte:["Non ancora... Esattore... non ancora..."] },
  308: { nm:"Messaggero Burlone", lg:"L2", st:"POT 3 · DAN 3",
    entrata:["Ho notizie! Cattive per te, divertenti per me."],
    triggerAttivato:["Arrivo prima io! *Sorpresa!*"],
    vince:["Ah! Te l'avevo *detto* che erano cattive notizie."],
    perde:["Ops. Questa non me l'aspettavo."],
    stat:["Fatti sotto, colosso. Ho una pessima notizia per te."],
    morte:["L'ultima... battuta..."] }
};

SatzeDialogue.injectFonts();
var scene = document.getElementById('scene');
var dlg = new SatzeDialogue.Box({ mount: scene, charMs: 34 });
scene.addEventListener('click', function(){ if(!dlg.isDone()) dlg.skip(); });

var pick = document.getElementById('pick');
Object.keys(D).forEach(function(id){
  var o=document.createElement('option'); o.value=id; o.textContent=D[id].nm; pick.appendChild(o);
});
pick.value = '311';

function cur(){ return D[pick.value]; }
function paintCard(){ var c=cur();
  document.getElementById('c-nm').textContent=c.nm;
  document.getElementById('c-lg').textContent=c.lg;
  document.getElementById('c-st').textContent=c.st;
}
function pickLine(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function say(ev, onDone){
  var c=cur(); var pool=c[ev]; if(!pool) return;
  dlg.say({
    army:'corte', name:c.nm, text:pickLine(pool),
    x:'50%', y:250, side:'above',
    emphasis: document.getElementById('emph').checked ? undefined : 'all',
    onDone:onDone
  });
}

pick.addEventListener('change', paintCard);
document.querySelectorAll('button[data-ev]').forEach(function(b){
  b.addEventListener('click', function(){ say(b.getAttribute('data-ev')); });
});

// sequenza di scontro: entrata -> stat(reveal) -> trigger -> esito
document.getElementById('seq').addEventListener('click', function(){
  var steps=['entrata','stat','triggerAttivato', Math.random()<0.6?'vince':'perde'];
  var i=0;
  (function next(){
    if(i>=steps.length){ setTimeout(function(){ dlg.hide(); },1100); return; }
    say(steps[i], function(){ i++; setTimeout(next, 900); });
  })();
});

paintCard();
</script>
</body>
</html>
