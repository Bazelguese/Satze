<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Genera GIF menu (32-bit, basata su immagine)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; text-align: center; }
    canvas { display: block; margin: 1rem auto; border: 1px solid #333; background: #000; max-width: 100%; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; background: #c2410c; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #ea580c; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    p { margin: 1rem 0; opacity: 0.9; max-width: 560px; margin-left: auto; margin-right: auto; }
    .warn { color: #f59e0b; }
  </style>
</head>
<body>
  <h1>GIF menu – 32-bit, basata sulla tua immagine</h1>
  <p>Metti l’immagine del campo/accampamento in <strong>public/menu-bg-source.png</strong> (o .jpg), poi avvia il dev server e apri questa pagina.</p>
  <p id="imgStatus" class="warn">Caricamento immagine…</p>
  <canvas id="c" width="1280" height="720"></canvas>
  <br />
  <button id="btn" disabled>Genera e scarica menu-bg-war.gif</button>
  <p id="status"></p>

  <script type="module">
    const WIDTH = 1280;
    const HEIGHT = 720;
    const FPS = 20;
    const TOTAL_FRAMES = 50;
    const DELAY_MS = Math.round(1000 / FPS);

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const imgStatus = document.getElementById('imgStatus');

    let sourceImage = null;

    function loadImage() {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { sourceImage = img; imgStatus.textContent = 'Immagine caricata. Clicca il pulsante per generare la GIF.'; btn.disabled = false; resolve(); };
        img.onerror = () => {
          img.onerror = () => { imgStatus.textContent = 'Immagine non trovata. Metti menu-bg-source.png o menu-bg-source.jpg in public/ e ricarica.'; resolve(); };
          img.src = '/menu-bg-source.jpg?' + Date.now();
        };
        img.src = '/menu-bg-source.png?' + Date.now();
      });
    }

    function drawFrame(frame) {
      if (sourceImage) {
        const iw = sourceImage.width;
        const ih = sourceImage.height;
        const r = Math.max(WIDTH / iw, HEIGHT / ih);
        const sw = iw * r;
        const sh = ih * r;
        const sx = (sw - WIDTH) / 2;
        const sy = (sh - HEIGHT) / 2;
        ctx.drawImage(sourceImage, -sx, -sy, sw, sh);
      } else {
        ctx.fillStyle = '#0a0c0e';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      const t = frame / TOTAL_FRAMES;
      const flicker = 0.92 + 0.08 * Math.sin(frame * 0.5);
      const pulse = 0.88 + 0.12 * Math.sin(frame * 0.3);

      const torch = ctx.createRadialGradient(WIDTH * 0.5, HEIGHT * 0.7, 0, WIDTH * 0.5, HEIGHT * 0.7, WIDTH * 0.8);
      torch.addColorStop(0, `rgba(255, 140, 60, ${0.06 * flicker})`);
      torch.addColorStop(0.4, `rgba(200, 80, 30, ${0.04 * pulse})`);
      torch.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = torch;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const torch2 = ctx.createRadialGradient(WIDTH * 0.25, HEIGHT * 0.6, 0, WIDTH * 0.25, HEIGHT * 0.6, WIDTH * 0.4);
      torch2.addColorStop(0, `rgba(255, 120, 50, ${0.05 * flicker})`);
      torch2.addColorStop(0.6, 'rgba(0,0,0,0)');
      ctx.fillStyle = torch2;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const torch3 = ctx.createRadialGradient(WIDTH * 0.75, HEIGHT * 0.55, 0, WIDTH * 0.75, HEIGHT * 0.55, WIDTH * 0.35);
      torch3.addColorStop(0, `rgba(255, 100, 40, ${0.045 * pulse})`);
      torch3.addColorStop(0.7, 'rgba(0,0,0,0)');
      ctx.fillStyle = torch3;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const fog = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      fog.addColorStop(0, 'rgba(15, 20, 35, 0.08)');
      fog.addColorStop(0.6, 'rgba(0,0,0,0)');
      fog.addColorStop(1, `rgba(0, 5, 15, ${0.12 * flicker})`);
      ctx.fillStyle = fog;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    async function generateGif() {
      btn.disabled = true;
      status.textContent = 'Caricamento encoder…';

      const { GIFEncoder, quantize, applyPalette } = await import('https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js');
      status.textContent = 'Generazione frame 0/' + TOTAL_FRAMES + ' (32-bit, palette 256 colori)…';

      const gif = GIFEncoder();

      for (let frame = 0; frame < TOTAL_FRAMES; frame++) {
        drawFrame(frame);
        const imageData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
        const pal = quantize(imageData.data, 256);
        const index = applyPalette(imageData.data, pal);
        gif.writeFrame(index, WIDTH, HEIGHT, { palette: pal, delay: DELAY_MS });
        if (frame % 10 === 0) status.textContent = 'Generazione frame ' + (frame + 1) + '/' + TOTAL_FRAMES + '…';
      }

      gif.finish();
      const blob = new Blob([gif.bytes()], { type: 'image/gif' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'menu-bg-war.gif';
      a.click();
      URL.revokeObjectURL(url);

      status.textContent = 'Fatto. Sposta menu-bg-war.gif in public/ del progetto. Il menu la userà come sfondo.';
      btn.disabled = false;
    }

    loadImage().then(() => {
      drawFrame(0);
      btn.addEventListener('click', generateGif);
    });
  </script>
</body>
</html>
