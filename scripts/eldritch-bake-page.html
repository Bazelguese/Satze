<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Eldritch composita bake</title>
  <style>
    html, body {
      margin: 0;
      background: transparent !important;
    }
    #card {
      position: relative;
      width: 1104px;
      height: 1584px;
      isolation: isolate;
      overflow: hidden;
      background: transparent;
      --eld-cornice-clip: inset(3.3% 4.5% 3.5% 4.5% round 4.8%);
    }
    #card img, #card .layout {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
    }
    #card .bg,
    #card .subject,
    #card .frame,
    #card .break {
      object-fit: fill;
    }
    #card .layout {
      object-fit: fill;
    }
    #card .window {
      position: absolute;
      inset: 0;
      clip-path: var(--eld-cornice-clip);
      overflow: hidden;
      background: #07070c;
    }
    #card .bg { z-index: 0; }
    #card .subject { z-index: 1; }
    #card .frame { z-index: 3; }
    #card .break { z-index: 4; }
    #card .layout-ink-name,
    #card .layout-ink { z-index: 5; clip-path: var(--eld-cornice-clip); }
    /* Macchia nome sopra l’arte, sotto i break. */
    #card.name-ink-under .layout-ink-name { z-index: 4; }
    #card.name-ink-under .break { z-index: 5; }
    #card.name-ink-under .layout-ink { z-index: 6; }
    #card.name-ink-under .break.over-ink { z-index: 7; }
    #card.name-ink-under .layout-type { z-index: 8; }
    #card.name-ink-under .break.above { z-index: 9; }
    #card.ink-under-subject .layout-ink-name,
    #card.ink-under-subject .layout-ink { z-index: 1; }
    #card.ink-under-subject .window { z-index: 2; }
    #card .break.over-ink { z-index: 6; }
    #card .layout-type { z-index: 7; }
    #card .break.above { z-index: 8; }
    #card .layout-ink-name [data-layer="type"],
    #card .layout-ink-name [data-layer="league-ring"],
    #card .layout-ink-name [data-layer="frame"],
    #card .layout-ink-name [data-layer="ink"],
    #card .layout-ink [data-layer="type"],
    #card .layout-ink [data-layer="league-ring"],
    #card .layout-ink [data-layer="frame"],
    #card .layout-ink [data-layer="ink-name"] { display: none !important; }
    #card .layout-type [data-layer="ink"],
    #card .layout-type [data-layer="ink-name"] { display: none !important; }
    #card .layout svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="card"></div>
  <script type="module">
    import {
      ALL_FACE_CARDS,
      CARD_FACE_FONT_ASSETS,
      LAYERED_CARD_KITS,
      agentToFaceData,
      buildAssets,
      getArmyChromeUrls,
    } from '/src/components/cardFaceLab/cardFaceLabData.js';
    import { loadCardFaceFonts, renderCardFace } from '/src/components/cardFaceLab/alfaCardRenderer.js';
    import { normalizeEldritchSvgTo2333 } from '/src/components/cardFaceLab/eldritchFormat2333.js';

    const DEFAULT_COMPOSITION = {
      subjectScale: 1.025,
      subjectXPercent: 0,
      subjectYPercent: 0,
      backgroundScale: 1.07,
      backgroundYPercent: 0,
      breakHeadClip: 'polygon(0 0, 100% 0, 100% 29%, 0 29%)',
      breakHeadMask: undefined,
      breakHeadAbove: true,
      breakShoulderClip: 'polygon(0 31%, 31% 31%, 31% 71%, 0 71%)',
      breakShoulderMask:
        'linear-gradient(to bottom, transparent 31%, #000 40%, #000 59%, transparent 71%)',
      breakRightClip: undefined,
      breakRightMask: undefined,
      breakExtraClip: undefined,
      breakExtraMask: undefined,
      breaksAboveLayout: false,
    };

    function mergeComposition(kitComp) {
      const c = { ...DEFAULT_COMPOSITION, ...(kitComp || {}) };
      // null/false nel kit = disattiva il default (non ripristinare il polygon base)
      for (const key of [
        'breakHeadClip',
        'breakHeadMask',
        'breakShoulderClip',
        'breakShoulderMask',
        'breakRightClip',
        'breakRightMask',
        'breakExtraClip',
        'breakExtraMask',
      ]) {
        if (kitComp && Object.prototype.hasOwnProperty.call(kitComp, key) && !kitComp[key]) {
          c[key] = null;
        }
      }
      // Kit con head clip spento = tutto in cornice (non forzare Berserker).
      const headOff =
        kitComp &&
        Object.prototype.hasOwnProperty.call(kitComp, 'breakHeadClip') &&
        !kitComp.breakHeadClip;
      const headAboveExplicit =
        kitComp && Object.prototype.hasOwnProperty.call(kitComp, 'breakHeadAbove');
      if (headOff) {
        c.breakHeadClip = null;
        c.breakHeadAbove = false;
      } else {
        if (!c.breakHeadClip) c.breakHeadClip = DEFAULT_COMPOSITION.breakHeadClip;
        c.breakHeadAbove = headAboveExplicit
          ? kitComp.breakHeadAbove
          : c.breakHeadAbove == null
            ? true
            : c.breakHeadAbove;
      }
      return c;
    }

    /** Con Vite, BASE è / — lascia i path; con ./ mappa a root public. */
    function pub(url) {
      if (!url) return '';
      const u = String(url);
      if (u.startsWith('http') || u.startsWith('data:')) return u;
      if (u.startsWith('/')) return u;
      if (u.startsWith('./')) return '/' + u.slice(2);
      return '/' + u.replace(/^\//, '');
    }

    function maskStyle(clip, mask) {
      const s = { clipPath: clip };
      if (mask) {
        s.webkitMaskImage = mask;
        s.maskImage = mask;
      }
      return s;
    }

    function applyStyle(el, style) {
      Object.assign(el.style, style);
    }

    window.__ELD_BAKE__ = async function bake(id) {
      const kit = LAYERED_CARD_KITS[id];
      if (!kit) throw new Error('kit missing ' + id);
      const agent = ALL_FACE_CARDS.find((c) => c.id === id);
      if (!agent) throw new Error('agent missing ' + id);

      const fonts = {
        displayFont: pub(CARD_FACE_FONT_ASSETS.displayFont),
        bodyFont: pub(CARD_FACE_FONT_ASSETS.bodyFont),
      };
      await loadCardFaceFonts(fonts);

      const face = agentToFaceData(agent, 'eldritch');
      const assets = {
        ...buildAssets(undefined, {
          styleMode: 'eldritch',
          faction: face.faction,
          useArmyChrome: true,
        }),
        layoutOnly: true,
      };
      // Fix asset URLs for static server
      for (const key of Object.keys(assets)) {
        if (typeof assets[key] === 'string' && assets[key].includes('/')) {
          assets[key] = pub(assets[key]);
        }
      }

      const { svg: rawSvg } = renderCardFace(
        { ...face, layoutOnly: true, illustration: undefined },
        assets
      );
      const svg = normalizeEldritchSvgTo2333(rawSvg, { stretch: true });

      const c = mergeComposition(kit.composition);
      const subjectUrl = pub(kit.subject);
      const backgroundUrl = pub(kit.background);
      const frameUrl =
        pub(kit.frame) ||
        pub(getArmyChromeUrls(kit.faction || face.faction)?.frame) ||
        '';

      const root = document.getElementById('card');
      root.innerHTML = '';
      const classes = [];
      if (c.inkAboveSubject === false) classes.push('ink-under-subject');
      if (c.nameInkUnderSubject) classes.push('name-ink-under');
      root.className = classes.join(' ');

      const windowEl = document.createElement('div');
      windowEl.className = 'window';

      const bg = document.createElement('img');
      bg.className = 'bg';
      bg.src = backgroundUrl;
      applyStyle(bg, {
        transform: `translate(0%, ${c.backgroundYPercent}%) scale(${c.backgroundScale})`,
      });

      const subject = document.createElement('img');
      subject.className = 'subject';
      subject.src = subjectUrl;
      applyStyle(subject, {
        transform: `translate(${c.subjectXPercent || 0}%, ${c.subjectYPercent}%) scale(${c.subjectScale})`,
      });

      windowEl.append(bg, subject);
      root.append(windowEl);

      const breakTier = (flag) => {
        const v = flag != null ? flag : c.breaksAboveLayout;
        if (v === 'ink' || v === 'over-ink') return 'over-ink';
        if (v === true || v === 'type' || v === 'above') return 'above';
        return 'below';
      };

      const mkBreak = (clip, mask, aboveFlag) => {
        if (!clip) return null;
        const tier = breakTier(aboveFlag);
        const img = document.createElement('img');
        img.className =
          'break' +
          (tier === 'above' ? ' above' : tier === 'over-ink' ? ' over-ink' : '');
        img.src = subjectUrl;
        applyStyle(img, {
          ...maskStyle(clip, mask),
          transform: `translate(${c.subjectXPercent || 0}%, ${c.subjectYPercent}%) scale(${c.subjectScale})`,
        });
        img.dataset.tier = tier;
        return img;
      };

      const breaks = [
        mkBreak(c.breakHeadClip, c.breakHeadMask, c.breakHeadAbove),
        mkBreak(c.breakShoulderClip, c.breakShoulderMask, c.breakShoulderAbove),
        mkBreak(c.breakRightClip, c.breakRightMask, c.breakRightAbove),
        mkBreak(c.breakExtraClip, c.breakExtraMask, c.breakExtraAbove),
      ].filter(Boolean);

      if (frameUrl) {
        const frame = document.createElement('img');
        frame.className = 'frame';
        frame.src = frameUrl;
        root.append(frame);
      }

      const mkLayout = (cls) => {
        const el = document.createElement('div');
        el.className = `layout ${cls}`;
        el.innerHTML = svg;
        return el;
      };

      // name-ink-under: macchia nome → break → macchie stats → testi
      if (c.nameInkUnderSubject) root.append(mkLayout('layout-ink-name'));
      for (const b of breaks) {
        if (b.dataset.tier === 'below') root.append(b);
      }
      root.append(mkLayout('layout-ink'));
      if (!c.nameInkUnderSubject) root.append(mkLayout('layout-ink-name'));
      for (const b of breaks) {
        if (b.dataset.tier === 'over-ink') root.append(b);
      }
      root.append(mkLayout('layout-type'));
      for (const b of breaks) {
        if (b.dataset.tier === 'above') root.append(b);
      }

      const imgs = [...root.querySelectorAll('img')];
      await Promise.all(
        imgs.map((img) =>
          img.decode().catch(() => {
            /* missing optional frame ok */
          })
        )
      );
      // Fonts / SVG paint settle
      await document.fonts.ready;
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      return {
        id,
        slug: kit.slug,
        ok: true,
        breakCount: breaks.length,
        head: c.breakHeadClip,
        shoulder: c.breakShoulderClip,
        headAbove: c.breakHeadAbove,
        shoulderAbove: c.breakShoulderAbove,
        nameInkUnder: !!c.nameInkUnderSubject,
      };
    };
  </script>
</body>
</html>
