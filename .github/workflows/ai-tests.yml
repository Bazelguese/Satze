name: AI regression tests

on:
  pull_request:
    paths:
      - 'src/game/ai/**'
      - 'src/game/duel/**'
      - 'src/game/triggerLogic.js'
      - 'src/game/battlefieldEffects.js'
      - 'src/game/duelResolve.js'
      - 'package.json'
      - '.github/workflows/ai-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            package.json
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm run test:unit
